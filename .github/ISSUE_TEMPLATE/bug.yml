name: Bug report
description: Something crashed, produced wrong output, or a client could not connect
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a finding you disagree with, use the false positive or missed detection template instead.

        For a vulnerability in this tool itself, follow [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the tool call arguments, or the `npm run mcp:call -- ...` command.
      render: shell
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Claude Code 2.x, Codex, Cursor, direct npm run mcp:call
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node version and OS
      placeholder: Node 22.11 on macOS 15
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Rust Security Auditor version
    validations:
      required: true
