name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A security tool should model the practice it recommends: least-privilege
# tokens and third-party actions pinned to an immutable commit SHA.
permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22, 24]
        exclude:
          # Keep the matrix small: only the minimum supported Node runs on
          # every OS, and newer Node versions run on Linux.
          - os: macos-latest
            node-version: 22
          - os: macos-latest
            node-version: 24
          - os: windows-latest
            node-version: 22
          - os: windows-latest
            node-version: 24

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify real package install and stdio boundary
        run: npm run verify:package

  hygiene:
    name: Whitespace and dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check whitespace
        run: git diff --check

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify real package contents and installed stdio boundary
        run: npm run verify:package

  release-gate:
    # The release job installs npm@latest, because trusted publishing needs a
    # newer npm than the runner ships. That made the release gate the only step
    # running on an npm nothing else tested, and npm 12 changing the shape of
    # `npm pack --json` broke a release rather than a pull request. This runs
    # the same gate on the same npm, so that skew fails here first.
    name: Release gate on npm@latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Use the npm the release job uses
        run: npm install -g npm@latest

      - name: Report the npm under test
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify real package contents and installed stdio boundary
        run: npm run verify:package
