version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development

  # Workflow actions are pinned to commit SHAs, so Dependabot is what keeps
  # those pins current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
